- name: Send Discord embed
  run: |
    curl -H "Content-Type: application/json" \
    -X POST \
    -d "{
      \"embeds\": [{
        \"title\": \"New Release: ${{ github.event.release.tag_name }}\",
        \"description\": \"${{ github.event.release.body }}\",
        \"url\": \"${{ github.event.release.html_url }}\",
        \"color\": 5814783
      }]
    }" \
    ${{ secrets.DISCORD_WEBHOOK }}
